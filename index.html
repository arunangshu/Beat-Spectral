<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral Beat Detector 🎵</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 { font-weight: 300; letter-spacing: 2px; }

        #controls {
            margin-bottom: 20px;
            z-index: 10;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: #ff4757;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ff4757;
        }

        canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            z-index: 2;
        }

        /* The "Beat" Indicator - Disco Glow Top 70% */
        #beat-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: transparent;
            pointer-events: none;
            transition: background 0.1s ease-out, box-shadow 0.1s ease-out;
            z-index: 10;
        }

        #status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        /* Beat Hit Effect on Background */
        .beat-hit {
            background-color: #1a1a1a !important; 
        }

        /* Player Container */
        #player-container {
            display: none;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.95), rgba(30, 30, 50, 0.9));
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 150, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2), inset 0 0 20px rgba(0, 100, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
            margin-top: 15px;
        }

        /* Player Controls */
        #player-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 300px;
        }

        /* Play/Pause Button */
        #play-pause-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(0, 150, 255, 0.6);
            background: linear-gradient(135deg, rgba(0, 100, 200, 0.3), rgba(0, 50, 150, 0.5));
            color: #00d4ff;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3), inset 0 0 10px rgba(0, 150, 255, 0.2);
        }

        #play-pause-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.5), inset 0 0 15px rgba(0, 200, 255, 0.3);
            border-color: #00d4ff;
        }

        /* Time Display */
        #time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #00d4ff;
            font-family: 'Consolas', monospace;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        /* Seek Slider */
        #seek-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(0, 150, 255, 0.3), rgba(0, 100, 200, 0.2));
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.2);
        }

        #seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0096ff);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.8), 0 0 30px rgba(0, 150, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s;
        }

        #seek-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #seek-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0096ff);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Sensitivity Control */
        #sensitivity-container {
            display: none;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            padding: 15px 25px;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.9), rgba(30, 30, 50, 0.85));
            border-radius: 15px;
            border: 1px solid rgba(255, 71, 87, 0.3);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.15);
            z-index: 10;
        }

        #sensitivity-container label {
            color: #ff4757;
            font-size: 0.9em;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        #sensitivity-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 150px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, rgba(255, 71, 87, 0.3), rgba(200, 50, 70, 0.2));
            outline: none;
            cursor: pointer;
        }

        #sensitivity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b7a, #ff4757);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        #sensitivity-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b7a, #ff4757);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        #sensitivity-value {
            color: #ff4757;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
            min-width: 40px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        /* Song Title */
        #song-title {
            color: #fff;
            font-size: 0.95em;
            font-weight: 500;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Controls Row */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Style Toggle Button */
        #style-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(40, 40, 60, 0.9), rgba(20, 20, 40, 0.95));
            border: 1px solid rgba(0, 200, 255, 0.4);
            color: #00d4ff;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.2);
        }

        #style-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.4);
            border-color: #00d4ff;
        }

        /* Ripple Canvas */
        #ripple-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* Tap Tempo Container */
        #tap-tempo-container {
            position: absolute;
            bottom: 45%;
            left: 20px;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.95), rgba(30, 30, 50, 0.9));
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 71, 87, 0.4);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.2);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #tap-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255, 71, 87, 0.6);
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.3), rgba(200, 50, 70, 0.5));
            color: #ff6b7a;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        }

        #tap-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
        }

        #tap-btn:active, #tap-btn.tapped {
            transform: scale(0.95);
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.6), rgba(200, 50, 70, 0.8));
        }

        #bpm-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bpm-adjust-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255, 71, 87, 0.5);
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bpm-adjust-btn:hover {
            background: rgba(255, 71, 87, 0.4);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        #bpm-display {
            color: #ff4757;
            font-size: 1.4em;
            font-weight: bold;
            font-family: 'Consolas', monospace;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
            min-width: 80px;
            text-align: center;
        }

        #tap-label {
            color: #aaa;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #reset-tap {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #888;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.7em;
            transition: all 0.2s;
        }

        #reset-tap:hover {
            border-color: #ff4757;
            color: #ff4757;
        }

        /* Dance Video Container */
        #dance-container {
            position: absolute;
            bottom: 45%;
            right: 20px;
            z-index: 20;
        }

        #dance-video {
            width: 200px;
            height: auto;
            display: block;
        }

        /* Energy Glow Background */
        #energy-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            transition: box-shadow 0.1s ease-out;
        }

        /* Star Canvas */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }
    </style>
</head>
<body>

    <h1>BEAT <span style="color:#ff4757">SPECTRAL</span></h1>
    
    <div id="controls">
        <label for="audio-upload" class="btn">📂 Upload Song</label>
        <input type="file" id="audio-upload" accept="audio/*">
        <button id="capture-btn" class="btn" style="background: #9b59b6;">🎤 Capture System Audio</button>
    </div>

    <div id="status">Upload a file to start visualization</div>

    <!-- Player Container -->
    <div id="player-container">
        <div id="player-controls">
            <div id="song-title">No song loaded</div>
            <div class="controls-row">
                <button id="play-pause-btn">▶</button>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
                    <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1">
                    <div id="time-display">
                        <span id="current-time">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sensitivity Control -->
    <div id="sensitivity-container">
        <label for="sensitivity-slider">⚡ Beat Sensitivity</label>
        <input type="range" id="sensitivity-slider" min="0" max="30" value="2">
        <span id="sensitivity-value">2%</span>
    </div>

    <!-- Style Toggle -->
    <button id="style-toggle">🌊 Style: Ripples</button>

    <!-- Tap Tempo Interface -->
    <div id="tap-tempo-container">
        <div id="tap-label">Tap Tempo</div>
        <button id="tap-btn">🦋</button>
        <div id="bpm-row">
            <button class="bpm-adjust-btn" id="bpm-minus">−</button>
            <div id="bpm-display">-- BPM</div>
            <button class="bpm-adjust-btn" id="bpm-plus">+</button>
        </div>
        <button id="reset-tap">Reset</button>
    </div>

    <!-- Dance Video -->
    <div id="dance-container">
        <video id="dance-video" loop muted>
            <source src="dance.webm" type="video/webm">
        </video>
    </div>

    <div id="energy-glow"></div>
    <canvas id="star-canvas"></canvas>
    <div id="beat-light"></div>
    <canvas id="ripple-canvas"></canvas>

    <canvas id="visualizer"></canvas>

    <script>
    const fileInput = document.getElementById('audio-upload');
    const captureBtn = document.getElementById('capture-btn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const beatLight = document.getElementById('beat-light');
    const playerContainer = document.getElementById('player-container');
    const sensitivityContainer = document.getElementById('sensitivity-container');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeDisplay = document.getElementById('current-time');
    const durationDisplay = document.getElementById('duration');
    const sensitivitySlider = document.getElementById('sensitivity-slider');
    const sensitivityValue = document.getElementById('sensitivity-value');
    const songTitle = document.getElementById('song-title');
    const styleToggle = document.getElementById('style-toggle');
    const rippleCanvas = document.getElementById('ripple-canvas');
    const rippleCtx = rippleCanvas.getContext('2d');
    const tapBtn = document.getElementById('tap-btn');
    const bpmDisplay = document.getElementById('bpm-display');
    const resetTapBtn = document.getElementById('reset-tap');
    const danceVideo = document.getElementById('dance-video');
    const bpmPlusBtn = document.getElementById('bpm-plus');
    const bpmMinusBtn = document.getElementById('bpm-minus');
    const energyGlow = document.getElementById('energy-glow');

    // Star canvas setup
    const starCanvas = document.getElementById('star-canvas');
    const starCtx = starCanvas.getContext('2d');
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    
    // Stars array
    let stars = [];
    const MAX_STARS = 150;
    
    function createStar() {
        return {
            x: Math.random() * starCanvas.width,
            y: Math.random() * starCanvas.height,
            size: Math.random() * 2 + 0.5,
            twinkleSpeed: Math.random() * 0.05 + 0.02,
            twinklePhase: Math.random() * Math.PI * 2,
            baseAlpha: Math.random() * 0.5 + 0.3
        };
    }
    
    function updateStars(energy) {
        // Add stars when music is playing (energy > 0)
        if (energy > 0.01 && stars.length < MAX_STARS) {
            // Add a few stars per frame based on energy
            const starsToAdd = Math.ceil(energy * 5);
            for (let i = 0; i < starsToAdd && stars.length < MAX_STARS; i++) {
                stars.push(createStar());
            }
        }
        
        // Clear canvas
        starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
        
        // Draw and update stars
        for (let i = stars.length - 1; i >= 0; i--) {
            const star = stars[i];
            
            // Calculate twinkle
            star.twinklePhase += star.twinkleSpeed;
            const twinkle = (Math.sin(star.twinklePhase) + 1) / 2;
            const alpha = star.baseAlpha * (0.4 + twinkle * 0.6);
            
            // Make stars brighter with more energy
            const energyBoost = 1 + energy * 2;
            
            // Draw star
            starCtx.beginPath();
            starCtx.arc(star.x, star.y, star.size * energyBoost, 0, Math.PI * 2);
            starCtx.fillStyle = `rgba(255, 255, 255, ${alpha * energyBoost})`;
            starCtx.fill();
            
            // Add glow for brighter stars
            if (star.size > 1.5) {
                starCtx.beginPath();
                starCtx.arc(star.x, star.y, star.size * 2 * energyBoost, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.2})`;
                starCtx.fill();
            }
        }
        
        // Fade out stars when no music
        if (energy < 0.01) {
            for (let i = stars.length - 1; i >= 0; i--) {
                stars[i].baseAlpha -= 0.01;
                if (stars[i].baseAlpha <= 0) {
                    stars.splice(i, 1);
                }
            }
        }
    }

    // Update star canvas on resize
    window.addEventListener('resize', function() {
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;
    });

    let audioContext;
    let analyser;
    let dataArray;
    let source;
    let audioBuffer;
    
    // Style and ripple variables
    let currentStyle = 'ripples'; // 'glow' or 'ripples' - ripples is default
    let ripples = [];

    // Tap tempo variables
    let tapTimes = [];
    let currentBPM = 0;
    const VIDEO_BEATS = 16; // The webm file has 16 beats total
    let videoDuration = 0;
    let beatInterval = null; // Interval for auto color change
    let currentGlowColor = { r: 120, g: 40, b: 180 }; // Default purple
    let lastColorIndex = -1; // Track last color to avoid repetition
    
    // Get video duration once loaded
    danceVideo.addEventListener('loadedmetadata', function() {
        videoDuration = danceVideo.duration;
        console.log('Video duration:', videoDuration, 'seconds');
    });
    
    // Also check if metadata is already loaded (cached video)
    if (danceVideo.readyState >= 1) {
        videoDuration = danceVideo.duration;
        console.log('Video duration (cached):', videoDuration, 'seconds');
    }
    let isPlaying = false;
    let startTime = 0;
    let pauseTime = 0;
    let animationId;
    let mediaStream = null;
    let isCapturing = false;
    
    // Variables for your new logic
    let lastFrameData = null;
    let isFlashing = false;
    let sensitivity = 2;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight / 2;
    rippleCanvas.width = window.innerWidth;
    rippleCanvas.height = window.innerHeight;

    // Style toggle handler
    styleToggle.addEventListener('click', function() {
        if (currentStyle === 'ripples') {
            currentStyle = 'glow';
            styleToggle.textContent = '✨ Style: Glow';
            ripples = [];
            rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
        } else {
            currentStyle = 'ripples';
            styleToggle.textContent = '🌊 Style: Ripples';
            beatLight.style.background = 'transparent';
        }
    });

    // Tap Tempo Logic
    function changeGlowColor() {
        const discoColors = [
            { r: 255, g: 0, b: 128 },    // Hot pink
            { r: 0, g: 255, b: 255 },    // Cyan
            { r: 255, g: 255, b: 0 },    // Yellow
            { r: 255, g: 0, b: 255 },    // Magenta
            { r: 0, g: 255, b: 128 },    // Spring green
            { r: 255, g: 128, b: 0 },    // Orange
            { r: 128, g: 0, b: 255 },    // Purple
            { r: 0, g: 128, b: 255 },    // Sky blue
            { r: 255, g: 0, b: 0 },      // Red
            { r: 0, g: 255, b: 0 },      // Green
        ];
        
        // Pick a color at least 3 indices away from last one for visible contrast
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * discoColors.length);
        } while (discoColors.length > 3 && Math.abs(newIndex - lastColorIndex) < 3 && newIndex === lastColorIndex);
        
        lastColorIndex = newIndex;
        currentGlowColor = discoColors[newIndex];
    }

    function startBeatInterval() {
        // Clear existing interval
        if (beatInterval) {
            clearInterval(beatInterval);
        }
        
        if (currentBPM > 0) {
            // Calculate interval in ms from BPM
            const intervalMs = 60000 / currentBPM;
            beatInterval = setInterval(changeGlowColor, intervalMs);
        }
    }

    function handleTap() {
        const now = Date.now();
        
        // Change glow color on tap
        changeGlowColor();
        
        // Visual feedback
        tapBtn.classList.add('tapped');
        setTimeout(() => tapBtn.classList.remove('tapped'), 100);
        
        // If last tap was more than 2 seconds ago, reset
        if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > 2000) {
            tapTimes = [];
        }
        
        tapTimes.push(now);
        
        // Keep only last 8 taps
        if (tapTimes.length > 8) {
            tapTimes.shift();
        }
        
        // Need at least 2 taps to calculate BPM
        if (tapTimes.length >= 2) {
            // Calculate average interval between taps
            let totalInterval = 0;
            for (let i = 1; i < tapTimes.length; i++) {
                totalInterval += tapTimes[i] - tapTimes[i - 1];
            }
            const avgInterval = totalInterval / (tapTimes.length - 1);
            
            // Convert to BPM
            currentBPM = Math.round(60000 / avgInterval);
            bpmDisplay.textContent = currentBPM + ' BPM';
            
            // Update video playback speed
            updateVideoSpeed();
            
            // Start automatic color change at BPM
            startBeatInterval();
        }
    }
    
    function updateVideoSpeed() {
        if (currentBPM > 0 && videoDuration > 0) {
            // Calculate the original BPM of the video
            // Video has 16 beats in videoDuration seconds
            // Original BPM = (16 beats / videoDuration seconds) * 60
            const originalBPM = (VIDEO_BEATS / videoDuration) * 60;
            
            // Playback rate = desired BPM / original BPM
            const playbackRate = currentBPM / originalBPM;
            
            // Clamp playback rate to reasonable range (0.25x to 4x)
            const clampedRate = Math.max(0.25, Math.min(4, playbackRate));
            
            danceVideo.playbackRate = clampedRate;
            
            // Start video if not playing
            if (danceVideo.paused) {
                danceVideo.play();
            }
            
            console.log(`BPM: ${currentBPM}, Original BPM: ${originalBPM.toFixed(1)}, Playback Rate: ${clampedRate.toFixed(2)}x`);
        }
    }
    
    function resetTapTempo() {
        tapTimes = [];
        currentBPM = 0;
        bpmDisplay.textContent = '-- BPM';
        danceVideo.pause();
        danceVideo.currentTime = 0;
        danceVideo.playbackRate = 1;
        // Clear beat interval
        if (beatInterval) {
            clearInterval(beatInterval);
            beatInterval = null;
        }
        currentGlowColor = { r: 120, g: 40, b: 180 }; // Reset to purple
    }
    
    // Tap button click
    tapBtn.addEventListener('click', handleTap);
    
    // Reset button
    resetTapBtn.addEventListener('click', resetTapTempo);
    
    // BPM +/- buttons
    bpmPlusBtn.addEventListener('click', function() {
        if (currentBPM > 0) {
            currentBPM = Math.min(300, currentBPM + 1);
            bpmDisplay.textContent = currentBPM + ' BPM';
            updateVideoSpeed();
            startBeatInterval(); // Restart with new BPM
        }
    });
    
    bpmMinusBtn.addEventListener('click', function() {
        if (currentBPM > 1) {
            currentBPM = Math.max(1, currentBPM - 1);
            bpmDisplay.textContent = currentBPM + ' BPM';
            updateVideoSpeed();
            startBeatInterval(); // Restart with new BPM
        }
    });
    
    // Spacebar tap
    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' && !e.repeat) {
            // Prevent spacebar from scrolling or triggering other elements
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                handleTap();
            }
        }
    });

    // Sensitivity slider handler
    sensitivitySlider.addEventListener('input', function() {
        sensitivity = parseInt(this.value);
        sensitivityValue.textContent = sensitivity + '%';
    });

    // Capture System Audio (Stereo Mix)
    captureBtn.addEventListener('click', async function() {
        if (isCapturing) {
            stopCapture();
            return;
        }
        
        try {
            // Stop any current playback
            stopCurrentPlayback();
            
            status.innerText = "Requesting audio capture...";
            
            // Request microphone/stereo mix access
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                },
                video: false
            });
            
            // Set up audio context for capture
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 8192;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            // Connect stream to analyser
            source = audioContext.createMediaStreamSource(mediaStream);
            source.connect(analyser);
            // Note: Don't connect to destination to avoid feedback!
            
            isCapturing = true;
            captureBtn.textContent = '⏹️ Stop Capture';
            captureBtn.style.background = '#e74c3c';
            
            // Hide file player controls, show sensitivity
            playerContainer.style.display = 'none';
            sensitivityContainer.style.display = 'flex';
            songTitle.textContent = '🎤 System Audio';
            
            status.innerText = "Capturing system audio (Stereo Mix)...";
            
            // Start visualization
            if (!animationId) animate();
            
        } catch (err) {
            console.error('Error capturing audio:', err);
            status.innerText = "❌ Could not capture audio. Enable Stereo Mix in Windows Sound settings.";
        }
    });

    function stopCapture() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (source) {
            source.disconnect();
            source = null;
        }
        if (audioContext) {
            audioContext.close();
            audioContext = null;
        }
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        
        isCapturing = false;
        lastFrameData = null;
        captureBtn.textContent = '🎤 Capture System Audio';
        captureBtn.style.background = '#9b59b6';
        status.innerText = "Upload a file or capture system audio";
        sensitivityContainer.style.display = 'none';
        
        // Clear canvas
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function stopCurrentPlayback() {
        // Stop file playback
        if (source && !isCapturing) {
            try {
                source.stop();
                source.disconnect();
            } catch(err) {}
        }
        
        // Stop capture if active
        if (isCapturing) {
            stopCapture();
        }
        
        // Cancel animation
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        
        // Close audio context
        if (audioContext) {
            audioContext.close();
            audioContext = null;
        }
        
        // Reset state
        isPlaying = false;
        startTime = 0;
        pauseTime = 0;
        lastFrameData = null;
        isFlashing = false;
        audioBuffer = null;
        source = null;
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        status.innerText = "Loading Audio...";
        
        // Stop any current playback or capture
        stopCurrentPlayback();
        
        // Reset UI
        playPauseBtn.textContent = '▶';
        seekSlider.value = 0;
        currentTimeDisplay.textContent = '0:00';
        durationDisplay.textContent = '0:00';
        
        // Set song title
        songTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
        
        const reader = new FileReader();
        reader.onload = (event) => initAudio(event.target.result);
        reader.readAsArrayBuffer(file);
    });


    function initAudio(arrayBuffer) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 8192; 
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        audioContext.decodeAudioData(arrayBuffer, function(buffer) {
            audioBuffer = buffer;
            
            // Show player controls
            playerContainer.style.display = 'flex';
            sensitivityContainer.style.display = 'flex';
            
            // Set duration
            durationDisplay.textContent = formatTime(buffer.duration);
            seekSlider.max = Math.floor(buffer.duration);
            
            // Start playing
            startPlayback(0);
            status.innerText = "";
        });
    }

    function startPlayback(offset) {
        if (source) {
            source.disconnect();
            source.stop();
        }
        
        source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        
        source.onended = function() {
            if (isPlaying && pauseTime >= audioBuffer.duration - 0.1) {
                // Song ended naturally
                isPlaying = false;
                playPauseBtn.textContent = '▶';
                pauseTime = 0;
                seekSlider.value = 0;
                currentTimeDisplay.textContent = '0:00';
                // Pause dance video when song ends
                if (currentBPM > 0) {
                    danceVideo.pause();
                }
            }
        };
        
        startTime = audioContext.currentTime - offset;
        source.start(0, offset);
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
        
        // Resume dance video if BPM is set
        if (currentBPM > 0 && danceVideo.paused) {
            danceVideo.play();
        }
        
        if (!animationId) animate();
    }

    function togglePlayPause() {
        if (!audioBuffer) return;
        
        if (isPlaying) {
            // Pause
            pauseTime = audioContext.currentTime - startTime;
            source.stop();
            isPlaying = false;
            playPauseBtn.textContent = '▶';
            // Pause dance video when music pauses
            if (currentBPM > 0) {
                danceVideo.pause();
            }
        } else {
            // Resume
            startPlayback(pauseTime);
        }
    }

    playPauseBtn.addEventListener('click', togglePlayPause);

    seekSlider.addEventListener('input', function() {
        if (!audioBuffer) return;
        const seekTime = parseFloat(this.value);
        currentTimeDisplay.textContent = formatTime(seekTime);
    });

    seekSlider.addEventListener('change', function() {
        if (!audioBuffer) return;
        const seekTime = parseFloat(this.value);
        pauseTime = seekTime;
        if (isPlaying) {
            startPlayback(seekTime);
        } else {
            currentTimeDisplay.textContent = formatTime(seekTime);
        }
    });

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateSeekSlider() {
        if (!audioBuffer || !isPlaying) return;
        const currentTime = audioContext.currentTime - startTime;
        if (currentTime <= audioBuffer.duration) {
            seekSlider.value = currentTime;
            currentTimeDisplay.textContent = formatTime(currentTime);
            pauseTime = currentTime;
        }
    }

    // --- YOUR NEW LOGIC HERE ---
    function detectBeat(data) {
        // Number of bins to analyze (low frequencies where drums live)
        const numBins = 4096;
        const percentThreshold = sensitivity / 100; // Convert 0-100% slider to 0-1 decimal
        const percentRequired = 0.35; // 35% of bins must differ
        
        // Skip if we don't have previous frame data
        if (!lastFrameData) {
            lastFrameData = new Uint8Array(numBins);
            for (let i = 0; i < numBins; i++) {
                lastFrameData[i] = data[i];
            }
            return;
        }
        
        // Count how many bins differ by more than the % threshold
        let binsChanged = 0;
        for (let i = 0; i < numBins; i++) {
            const prev = lastFrameData[i];
            const curr = data[i];
            const diff = curr - prev;
            
            // Calculate % change relative to the max of current/previous (avoid div by 0)
            const maxVal = Math.max(prev, curr, 1); // Use at least 1 to avoid division by zero
            const percentChange = diff / maxVal;
            
            if (percentChange > percentThreshold) {
                binsChanged++;
            }
        }
        
        // Calculate percentage of bins that changed
        const percentChanged = binsChanged / numBins;
        
        // Trigger flash if at least 50% of bins changed significantly
        if (percentChanged >= percentRequired && !isFlashing) {
            triggerFlash();
        }
        
        // Store current frame for next comparison
        for (let i = 0; i < numBins; i++) {
            lastFrameData[i] = data[i];
        }
    }

    // Disco color generator
    function getRandomDiscoColor() {
        const discoColors = [
            { r: 255, g: 0, b: 128 },    // Hot pink
            { r: 0, g: 255, b: 255 },    // Cyan
            { r: 255, g: 255, b: 0 },    // Yellow
            { r: 255, g: 0, b: 255 },    // Magenta
            { r: 0, g: 255, b: 128 },    // Spring green
            { r: 255, g: 128, b: 0 },    // Orange
            { r: 128, g: 0, b: 255 },    // Purple
            { r: 0, g: 128, b: 255 },    // Sky blue
            { r: 255, g: 0, b: 0 },      // Red
            { r: 0, g: 255, b: 0 },      // Green
        ];
        return discoColors[Math.floor(Math.random() * discoColors.length)];
    }

    function triggerFlash() {
        isFlashing = true;
        
        // Get random disco color
        const color = getRandomDiscoColor();
        
        if (currentStyle === 'glow') {
            // GLOW STYLE
            const colorBright = `rgba(${color.r}, ${color.g}, ${color.b}, 0.6)`;
            const colorMid = `rgba(${color.r}, ${color.g}, ${color.b}, 0.3)`;
            
            beatLight.style.transition = "none";
            beatLight.style.background = `linear-gradient(to bottom, ${colorBright} 0%, ${colorMid} 50%, transparent 100%)`;
            beatLight.offsetHeight;

            setTimeout(() => {
                beatLight.style.transition = "background 0.1s ease-out";
                beatLight.style.background = "transparent";
                setTimeout(() => { isFlashing = false; }, 80);
            }, 20);
        } else {
            // RIPPLES STYLE
            // Create 1-3 ripples at random locations in top 70%
            const numRipples = Math.floor(Math.random() * 3) + 1;
            const spawnHeight = window.innerHeight * 0.7; // Spawn in top 70%
            for (let i = 0; i < numRipples; i++) {
                ripples.push({
                    x: Math.random() * rippleCanvas.width,
                    y: Math.random() * spawnHeight,
                    radius: 0,
                    maxRadius: 150 + Math.random() * 150,
                    color: color,
                    alpha: 1,
                    lineWidth: 3 + Math.random() * 3
                });
            }
            setTimeout(() => { isFlashing = false; }, 50);
        }
    }

    // Ripple animation loop
    function updateRipples() {
        rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
        
        for (let i = ripples.length - 1; i >= 0; i--) {
            const ripple = ripples[i];
            
            // Draw ripple
            rippleCtx.beginPath();
            rippleCtx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
            rippleCtx.strokeStyle = `rgba(${ripple.color.r}, ${ripple.color.g}, ${ripple.color.b}, ${ripple.alpha})`;
            rippleCtx.lineWidth = ripple.lineWidth;
            rippleCtx.shadowBlur = 20;
            rippleCtx.shadowColor = `rgba(${ripple.color.r}, ${ripple.color.g}, ${ripple.color.b}, ${ripple.alpha})`;
            rippleCtx.stroke();
            
            // Update ripple
            ripple.radius += 4;
            ripple.alpha -= 0.02;
            ripple.lineWidth *= 0.98;
            
            // Remove faded ripples
            if (ripple.alpha <= 0 || ripple.radius > ripple.maxRadius) {
                ripples.splice(i, 1);
            }
        }
        rippleCtx.shadowBlur = 0;
    }

    function animate() {
        animationId = requestAnimationFrame(animate);
        analyser.getByteFrequencyData(dataArray);

        // Calculate total energy for background glow
        let totalEnergy = 0;
        for (let i = 0; i < dataArray.length; i++) {
            totalEnergy += dataArray[i]*dataArray[i];
        }
        const avgEnergy = totalEnergy / dataArray.length;
        const normalizedEnergy = avgEnergy / (255 * 255); // 0 to 1
        
        // Apply energy-based background glow using current glow color
        // Spread and opacity vary with energy, blur is fixed
        const glowSpread = Math.floor(normalizedEnergy * 800) + 50; // 50-650px spread (large range)
        const glowBlur = 200; // Fixed blur
        const glowOpacity = 0.1 + (normalizedEnergy * 2); // 0.1-0.8 opacity
        energyGlow.style.boxShadow = `inset 0 0 ${glowBlur}px ${glowSpread}px rgba(${currentGlowColor.r}, ${currentGlowColor.g}, ${currentGlowColor.b}, ${glowOpacity})`;

        // Update stars
        updateStars(normalizedEnergy);

        // Draw Background
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update ripples if in ripple mode
        if (currentStyle === 'ripples') {
            updateRipples();
        }

        // Update seek slider
        updateSeekSlider();

        // Run Logic
        detectBeat(dataArray);

        // Draw Bars
        const barWidth = (canvas.width / dataArray.length) * 2.5;
        const heightScale = canvas.height / 280; // Scale bars to fit canvas
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
            const barHeight = (dataArray[i]+(dataArray[i]==255?Math.random()*25:0)) * heightScale;
            const r = dataArray[i] + (25 * (i/dataArray.length));
            const g = 250 * (i/dataArray.length);
            const b = 50;
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
        }
    }
